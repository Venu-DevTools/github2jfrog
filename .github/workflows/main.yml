name: Build and Upload to Artifactory (Fixed)

on:
  push:
    branches: [main]

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create artifact files 
        run: |
          mkdir my-artifacts
          echo "This is file 1" > my-artifacts/file1.txt
          echo "This is file 2" > my-artifacts/file2.json
      
      - name: Set up JFrog CLI
        uses: jfrog/setup-jfrog-cli@v3

      - name: Configure JFrog CLI
        run: |
          jfrog config add my-server --artifactory-url=${{ secrets.JF_URL }} --user=${{ secrets.JF_USERNAME }} --password=${{ secrets.JF_PASSWORD }} --interactive=false

      - name: Upload to Artifactory
        run: |
          jfrog rt upload "my-artifacts/*" "generic-repo-local/" --build-name=my-build --build-number=${{ github.run_number }}
